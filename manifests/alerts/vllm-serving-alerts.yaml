# vLLM serving-quality alerts. The GPU-level alerts in gpu-idle-alert.yaml catch
# cost waste (allocated-but-idle); these catch user-visible degradation on a card
# that is in use. Pairing them is the point: a serving system can be both busy
# AND slow (KV-cache full, queue backing up) or both idle AND wasteful - two
# different alerts, two different owners.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-serving
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: vllm.rules
      rules:
        # Record rules: precompute per-cluster throughput / efficiency.
        - record: job:vllm_tokens_per_sec:rate1m
          expr: sum(rate(vllm:generation_tokens_total[1m]))

        - record: job:vllm_ttft_seconds:p95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m]))
            )

        - record: job:vllm_e2e_seconds:p99
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[5m]))
            )

        - alert: VLLMHighTTFT
          expr: job:vllm_ttft_seconds:p95 > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "vLLM TTFT p95 above 2s for 5m"
            description: >
              Time-to-first-token p95 has been >2s for 5m. User-perceived "the
              model started answering" latency. Common causes: KV-cache near full
              (check vllm:gpu_cache_usage_perc), prefill queue backing up (check
              vllm:num_requests_waiting), or batch size misconfigured.

        - alert: VLLMQueueBackup
          expr: avg_over_time(vllm:num_requests_waiting[5m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "vLLM request queue averaging >5 waiting for 5m"
            description: >
              The waiting queue has averaged above 5 requests for 5m. Either the
              workload needs more GPU capacity (horizontal: more replicas, or
              vertical: a bigger card) or admission is unbounded.

        - alert: VLLMKVCacheSaturated
          expr: vllm:gpu_cache_usage_perc > 0.95
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "vLLM KV-cache above 95% for 5m"
            description: >
              The KV-cache is the binding resource for vLLM throughput. Above 95%,
              new requests cannot be scheduled without swapping (see
              vllm:num_requests_swapped) - TTFT and E2E latency climb sharply.

        - alert: VLLMSwappingUnderLoad
          expr: vllm:num_requests_swapped > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "vLLM has been swapping requests out of VRAM for 10m"
            description: >
              Non-zero swap for 10m means KV-cache stays full long enough to push
              requests back to CPU memory. This is a tail-latency killer.

    - name: vllm.sli
      rules:
        - record: sli:vllm_ttft_good:rate5m
          expr: sum(rate(vllm:time_to_first_token_seconds_bucket{le="1.0"}[5m]))
        - record: sli:vllm_ttft_total:rate5m
          expr: sum(rate(vllm:time_to_first_token_seconds_count[5m]))
        - record: sli:vllm_ttft_compliance:ratio5m
          expr: |
            sli:vllm_ttft_good:rate5m / sli:vllm_ttft_total:rate5m

        - record: slo:vllm_ttft_burn_rate:1h
          expr: |
            (1 - avg_over_time(sli:vllm_ttft_compliance:ratio5m[1h])) / 0.005
        - record: slo:vllm_ttft_burn_rate:6h
          expr: |
            (1 - avg_over_time(sli:vllm_ttft_compliance:ratio5m[6h])) / 0.005

        - alert: VLLMTTFTBudgetFastBurn
          expr: slo:vllm_ttft_burn_rate:1h > 14.4
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "vLLM TTFT SLO fast-burn: 2% of monthly budget in 1h"
            description: >
              The 1h burn rate against the 99.5% TTFT-under-1s SLO is above 14.4,
              meaning the service is on track to burn 2% of the monthly error
              budget in a single hour.

        - alert: VLLMTTFTBudgetSlowBurn
          expr: slo:vllm_ttft_burn_rate:6h > 6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "vLLM TTFT SLO slow-burn: 5% of monthly budget in 6h"
            description: >
              The 6h burn rate against the TTFT SLO is above 6. Capacity is
              probably undersized for the current traffic profile.

    # Cost records. The one knob is cost:gpu_hourly_usd - swap it for your
    # fleet's effective rate (reservations, savings plans, spot discount).
    # Default below: g2-standard-8 L4 on-demand in us-west1 (~$0.71/hr). Spot
    # is ~$0.21-0.28/hr depending on availability.
    - name: cost.rules
      rules:
        - record: cost:gpu_hourly_usd
          expr: vector(0.71)
        - record: cost:fleet_hourly_usd
          expr: cost:gpu_hourly_usd * count(DCGM_FI_DEV_GPU_UTIL)
        - record: cost:tokens_per_usd:rate1m
          expr: |
            (job:vllm_tokens_per_sec:rate1m * 3600) / cost:fleet_hourly_usd
        - record: cost:usd_per_million_tokens:rate1m
          expr: |
            1e6 / cost:tokens_per_usd:rate1m
