name: ci

# Credential-free quality gate: formatting, provider init (no backend), and
# config validation. Does not touch GCP, needs no secrets, runs green on every
# push and PR. Real applies and destroys are deliberate local actions.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.9.5"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
